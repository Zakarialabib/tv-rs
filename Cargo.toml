[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Zakarialabib/tv-rs"

[workspace.dependencies]
# --- protocol crates (path + version: `path` is stripped at publish time) ---
tv-rs-core = { path = "crates/core", version = "0.4.0" }
tv-rs-discovery = { path = "crates/discovery", version = "0.4.0" }
tv-rs-power = { path = "crates/power", version = "0.4.0" }
tv-rs-roku = { path = "crates/roku", version = "0.4.0" }
tv-rs-mdc = { path = "crates/mdc", version = "0.4.0" }
tv-rs-sicp = { path = "crates/sicp", version = "0.4.0" }
tv-rs-sim = { path = "crates/sim", version = "0.4.0" }
tv-rs-tizen = { path = "crates/tizen", version = "0.4.0" }
tv-rs-webos = { path = "crates/webos", version = "0.4.0" }
# Local display probe: no network, no TV control. Published separately.
tv-rs-local = { path = "crates/local", version = "0.4.0" }
# Shared transport vocabulary; must be published before tizen/webos.
#
# `default-features = false` keeps a TLS stack out of the crates that only need
# the `Unsupported` error vocabulary; `tizen`/`webos` opt back into the
# connector and frame reader with `features = ["ws"]`.
tv-rs-transport = { path = "crates/transport", version = "0.4.0" }
# Media server (206 + HLS). Published last: nothing in the workspace depends on it.
tv-rs-media = { path = "crates/media", version = "0.4.0" }
tv-rs-vision = { path = "crates/vision", version = "0.4.0" }
tv-rs-rules = { path = "crates/rules", version = "0.4.0" }

# --- runtime / async ---
tokio = { version = "1", features = ["net", "time", "io-util", "fs", "macros", "rt-multi-thread", "sync"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = { version = "0.25", default-features = false }
roxmltree = "0.21"

# --- transport ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# TLS features come from `tv-rs-transport` (rustls by default, native-tls opt-in),
# so this stays feature-free and the workspace cannot enable two backends at once.
tokio-tungstenite = { version = "0.30" }
# RS-232 for wired video walls (`tv-rs-mdc` feature `serial`). Optional so a
# deployment that never touches a serial port does not compile the stack.
tokio-serial = { version = "5" }
native-tls = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
# Platform root-store verification (Android's keystore, Apple's Security
# framework). Pinned to the version whose API was verified against docs.rs —
# this crate's API has moved between releases, so do not widen it blind.
# Not marked `optional` here: a workspace dependency cannot be, and optionality
# is declared by the member crate that wants it (`tv-rs-transport`).
rustls-platform-verifier = "0.7.1"
sha2 = "0.11"
url = "2"
base64 = "0.23"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rcgen = "0.14"

# --- errors / logging / cli ---
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"] }

# --- media server ---
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"

# --- dev ---
wiremock = "0.6"

[workspace.lints.rust]
missing_docs = "deny"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
