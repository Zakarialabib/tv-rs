[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/Zakarialabib/tv-rs"

[workspace.dependencies]
# --- protocol crates (path + version: `path` is stripped at publish time) ---
tv-rs-discovery = { path = "crates/discovery", version = "0.1.0" }
tv-rs-power = { path = "crates/power", version = "0.1.0" }
tv-rs-roku = { path = "crates/roku", version = "0.1.0" }
tv-rs-tizen = { path = "crates/tizen", version = "0.1.0" }
tv-rs-webos = { path = "crates/webos", version = "0.1.0" }
# Shared transport vocabulary; must be published before tizen/webos.
#
# `default-features = false` keeps a TLS stack out of the crates that only need
# the `Unsupported` error vocabulary; `tizen`/`webos` opt back into the
# connector and frame reader with `features = ["ws"]`.
tv-rs-transport = { path = "crates/transport", version = "0.1.0", default-features = false }
# Media server (206 + HLS). Published last: nothing in the workspace depends on it.
tv-rs-media = { path = "crates/media", version = "0.1.0" }

# --- runtime / async ---
tokio = { version = "1", features = ["net", "time", "io-util", "fs", "macros", "rt-multi-thread", "sync"] }
futures-util = "0.3"
async-trait = "0.1"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"

# --- transport ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# TLS features come from `tv-rs-transport` (rustls by default, native-tls opt-in),
# so this stays feature-free and the workspace cannot enable two backends at once.
tokio-tungstenite = { version = "0.30" }
native-tls = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
url = "2"
base64 = "0.23"

# --- errors / logging / cli ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }

# --- media server ---
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"

# --- dev ---
wiremock = "0.6"

[workspace.lints.rust]
missing_docs = "deny"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
