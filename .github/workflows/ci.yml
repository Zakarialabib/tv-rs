name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  core:
    name: core (tokio-free + mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The device model must stay embeddable by consumers that never link tokio.
      # This is the compile-time guarantee the spec makes, so CI has to hold it.
      - name: Core has no tokio in its graph
        run: |
          cargo tree -p tv-rs-core --no-default-features > /tmp/core-tree.txt
          if grep -qE '(^| )tokio v' /tmp/core-tree.txt; then
            echo "::error::tv-rs-core must not depend on tokio"
            exit 1
          fi
      - run: cargo test -p tv-rs-core --features "mock-backend conformance quirks"
      - run: cargo clippy -p tv-rs-core --all-targets --features "mock-backend conformance quirks"
        env:
          RUSTFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The `hil` feature is deliberately not enabled: these tests target real
      # televisions and must never run on a hosted runner.
      - run: cargo test --workspace
      # The facade must satisfy the same conformance suite every backend does.
      - run: cargo test -p tv-rs --features conformance
      # Quirk-driven port pinning lives on the facade, so its own test needs the feature.
      - run: cargo test -p tv-rs --features quirks
      - run: cargo check -p tv-rs --features quirks
      # The optional providers pull reqwest/rumqttc; default builds stay lean.
      - run: cargo test -p tv-rs-agent --features "http mqtt"
      - run: cargo test -p tv-rs-cec --features client

  features:
    name: per-crate features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Feature unification in `--workspace` hides crates that only compile when a
      # sibling turns an optional feature on. Each published crate is built alone.
      - run: cargo check -p tv-rs-transport --no-default-features
      - run: cargo check -p tv-rs-core --no-default-features
      - run: cargo check -p tv-rs-discovery
      - run: cargo check -p tv-rs-power
      - run: cargo check -p tv-rs-roku
      - run: cargo check -p tv-rs-tizen
      - run: cargo check -p tv-rs-webos
      - run: cargo check -p tv-rs-media
      - run: cargo check -p tv-rs-cec
      - run: cargo check -p tv-rs-cec --features client
      - run: cargo check -p tv-rs-agent
      - run: cargo check -p tv-rs

  msrv:
    name: msrv (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.89.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # `rust-version` is a promise; this job is the only thing that checks it.
      - run: cargo check --workspace --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
      # Optional features are documented explicitly: `--all-features` on the
      # workspace would enable both TLS backends at once, which is a compile error
      # by design (`rustls` and `native-tls` are mutually exclusive).
      - run: cargo doc --no-deps -p tv-rs-core --features "mock-backend conformance quirks"
      - run: cargo doc --no-deps -p tv-rs-agent --features "http mqtt"
      - run: cargo doc --no-deps -p tv-rs-cec --features client
