name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  core:
    name: core (tokio-free + mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The device model must stay embeddable by consumers that never link tokio.
      # This is the compile-time guarantee the spec makes, so CI has to hold it.
      - name: Core has no tokio in its graph
        run: |
          cargo tree -p tv-rs-core --no-default-features > /tmp/core-tree.txt
          if grep -qE '(^| )tokio v' /tmp/core-tree.txt; then
            echo "::error::tv-rs-core must not depend on tokio"
            exit 1
          fi
      - run: cargo test -p tv-rs-core --features "mock-backend conformance quirks"
      - run: cargo clippy -p tv-rs-core --all-targets --features "mock-backend conformance quirks"
        env:
          RUSTFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The `hil` feature is deliberately not enabled: these tests target real
      # televisions and must never run on a hosted runner.
      - run: cargo test --workspace
      # The facade must satisfy the same conformance suite every backend does.
      - run: cargo test -p tv-rs --features conformance
      # The optional providers pull reqwest/rumqttc; default builds stay lean.
      - run: cargo test -p tv-rs-agent --features "http mqtt"

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
