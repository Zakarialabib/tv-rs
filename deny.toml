# cargo-deny configuration.
#
# The point is not "no advisories ever" — it is that a network-facing crate must not
# ship a dependency with a known hole without a recorded decision.

[advisories]
yanked = "warn"
ignore = [
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained advisory from rumqttc dependency
    "RUSTSEC-2026-0049", # rustls-webpki advisory from rumqttc dependency
    "RUSTSEC-2026-0098", # rustls-webpki advisory from rumqttc dependency
    "RUSTSEC-2026-0099", # rustls-webpki advisory from rumqttc dependency
    "RUSTSEC-2026-0104", # rustls-webpki advisory from rumqttc dependency
    "RUSTSEC-2026-0382", # rustls-webpki advisory from rumqttc dependency
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    # Root-certificate *data*, not code: webpki-roots.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path-only dependencies inside the workspace (publish = false) carry no version
# requirement on purpose; Cargo.lock pins them. A wildcard on a *registry* crate
# is still refused.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
