[package]
name = "tv-rs-tizen"
description = "Samsung Tizen TV control: WebSocket remote channel (8001/8002), pairing tokens and DIAL app launching (8080)."
# This crate is ahead of the workspace: `TizenError::InvalidKey` is a new variant,
# which the 0.x policy treats as breaking, so the release is 0.2.0, not 0.1.1.
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["samsung", "tizen", "smart-tv", "dial", "websocket"]
categories = ["api-bindings", "network-programming"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tv-rs-transport = { workspace = true, features = ["ws", "rustls"] }
url.workspace = true

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true

[lints]
workspace = true
