[package]
name = "tv-rs-drivers"
description = "Consolidated protocol-vendor drivers for tv-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["smart-tv", "driver", "tizen", "webos", "roku", "mdc", "sicp"]
categories = ["api-bindings", "hardware-support"]

[features]
default = ["discovery", "power"]
discovery = [
    "dep:tv-rs-transport",
    "dep:thiserror",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
    "dep:reqwest",
    "dep:roxmltree",
    "dep:url",
    "dep:uuid",
    "dep:async-trait",
]
mobile = ["discovery", "dep:ipnet"]
power = [
    "dep:tv-rs-transport",
    "dep:thiserror",
    "dep:tokio",
    "dep:serde",
    "dep:async-trait",
]
tizen = [
    "dep:tv-rs-transport",
    "tv-rs-transport/ws",
    "tv-rs-transport/rustls",
    "dep:thiserror",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
    "dep:reqwest",
    "dep:roxmltree",
    "dep:url",
    "dep:base64",
    "dep:futures-util",
    "dep:tokio-tungstenite",
    "dep:async-trait",
]
webos = [
    "dep:tv-rs-transport",
    "tv-rs-transport/ws",
    "tv-rs-transport/rustls",
    "dep:thiserror",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
    "dep:url",
    "dep:futures-util",
    "dep:tokio-tungstenite",
    "dep:async-trait",
]
roku = [
    "dep:reqwest",
    "dep:roxmltree",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:tv-rs-transport",
    "dep:async-trait",
]
mdc = [
    "dep:tokio",
    "dep:thiserror",
    "dep:tracing",
    "dep:async-trait",
]
sicp = [
    "dep:tokio",
    "dep:thiserror",
    "dep:tracing",
    "dep:async-trait",
]
ir = [
    "dep:serde",
    "dep:thiserror",
    "dep:tokio",
    "dep:toml",
    "dep:tracing",
    "power",
    "dep:async-trait",
]
ir-network-bridge = ["ir", "dep:reqwest"]
serial = ["dep:tokio-serial"]
supporting = ["tv-rs-core/supporting"]
cec = [
    "dep:thiserror",
    "dep:tokio",
    "dep:libc",
    "dep:async-trait",
    "dep:tracing",
]
cec-native = ["cec", "dep:libc"]
cast = [
    "dep:thiserror",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
    "dep:reqwest",
    "dep:prost",
    "dep:bytes",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:pki-types",
    "dep:async-trait",
]
testkit = []
all = [
    "tizen", "webos", "roku", "mdc", "sicp",
    "ir", "cec", "cast", "discovery", "power",
    "mobile", "supporting", "serial", "ir-network-bridge",
]

[dependencies]
tv-rs-core = { workspace = true }
async-trait = { workspace = true, optional = true }

tv-rs-transport = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["process"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
roxmltree = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
ipnet = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tokio-serial = { workspace = true, optional = true }

base64 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
prost = { version = "0.13", optional = true }
bytes = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
pki-types = { package = "rustls-pki-types", version = "1.7", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { workspace = true }
wiremock = { workspace = true }
tv-rs-core = { workspace = true, features = ["conformance", "mock-backend"] }

[lints]
workspace = true
