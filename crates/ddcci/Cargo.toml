[package]
name = "tv-rs-ddcci"
description = "DDC/CI display protocol for physically attached monitors over I2C or platform monitor APIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ddc", "ddcci", "vcp", "monitor", "display"]
categories = ["hardware-support", "api-bindings"]

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "fs", "io-util"] }
tv-rs-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Devices_Display",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tv-rs-core = { workspace = true, features = ["conformance"] }

[lints]
workspace = true
