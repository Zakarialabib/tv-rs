[package]
name = "tv-rs-serial"
description = "Serial HAL, port enumeration, acquisition, and framing abstractions for RS-232/RS-422 displays."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["serial", "rs232", "rs422", "framing", "hal"]
categories = ["api-bindings", "hardware-support"]

[dependencies]
async-trait.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync", "io-util"] }
tokio-serial = { workspace = true }
tracing.workspace = true

tv-rs-core.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[features]
default = []
serde = ["dep:serde", "tv-rs-core/serde"]

[lints]
workspace = true
