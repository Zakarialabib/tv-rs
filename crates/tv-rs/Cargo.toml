[package]
name = "tv-rs"
description = "Cross-platform TV control and communications: SSDP discovery, Wake-on-LAN, Samsung Tizen, LG webOS and Roku ECP, behind one facade."
keywords = ["tv", "ssdp", "upnp", "wake-on-lan", "smart-tv"]
categories = ["api-bindings", "network-programming", "multimedia"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Facade re-exports the protocol crates; it holds no protocol logic of its own.
tv-rs-core.workspace = true
tv-rs-discovery.workspace = true
tv-rs-power.workspace = true
tv-rs-transport.workspace = true
tv-rs-tizen.workspace = true
tv-rs-webos.workspace = true
tv-rs-roku.workspace = true
# MDC is a protocol crate like the others, but it is not reached through
# `TvClient`: SSDP carries no authoritative vendor field, so a commercial panel
# is never *classified* from a discovery reply. The facade re-exports it so a
# caller that already knows (an operator adding a panel by address and display
# id) can name its types and use its `DeviceHandle`.
tv-rs-cec.workspace = true
tv-rs-ir.workspace = true
tv-rs-mdc.workspace = true
tv-rs-serial.workspace = true
tv-rs-sicp.workspace = true
tv-rs-spatial-audio.workspace = true

async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio.workspace = true
tv-rs-sim.workspace = true

[features]
# Hardware-in-the-loop tests. Off by default so `cargo test` never touches a
# physical television. Enable with `cargo test --features hil` and set the
# TV_RS_HIL_* environment variables documented in tests/hardware_in_the_loop.rs.
hil = []

# Runs the shared device-model conformance suite against the facade's clients.
conformance = ["tv-rs-core/conformance"]

# Consults `quirks/default.toml` when building a client, so a panel whose firmware
# is known to have dropped a port starts on the surviving one instead of paying a
# refused connection per command.
quirks = ["tv-rs-core/quirks"]

# Test doubles from the protocol crates (`tv-rs-tizen/testkit`, `tv-rs-webos/testkit`),
# so the facade can prove it reuses one pooled connection per TV (plan item 3.2)
# without a television in the loop. Off by default: a released build carries no
# test code.
testkit = ["tv-rs-tizen/testkit", "tv-rs-webos/testkit"]

# The LFD surfaces that most deployments never touch (panel/lamp hours and
# still-frame capture): the cloud agent deliberately carries no unused image
# path, so enabling this feature is what exposes them for testing.
supporting = []

[lints]
workspace = true
