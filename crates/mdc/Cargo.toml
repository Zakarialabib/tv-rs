[package]
name = "tv-rs-mdc"
description = "Deprecated shim for tv-rs-mdc; consolidated into tv-rs-drivers"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
supporting = ["tv-rs-drivers/supporting"]
serial = ["tv-rs-drivers/serial"]

[dependencies]
tv-rs-drivers = { workspace = true, features = ["mdc"] }

[dev-dependencies]
tokio = { workspace = true }
tv-rs-core = { workspace = true, features = ["conformance", "mock-backend"] }

[lints]
workspace = true
