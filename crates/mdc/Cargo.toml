[package]
name = "tv-rs-mdc"
description = "Samsung Multiple Display Control (MDC) over TCP 1515: frames, display IDs, power, input, volume, mute and brightness."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["samsung", "mdc", "signage", "display", "tcp"]
categories = ["api-bindings", "network-programming"]

[features]
# The supporting-tier LFD surfaces. `LampOrPanelHours` maps to MDC `0x83`
# (panel on-time); `ScreenCapture` has no MDC command and is never advertised,
# so only the hours surface is gated here.
supporting = ["tv-rs-core/supporting"]

# RS-232 as well as TCP. A wired video wall has no discovery, no DHCP and no TLS to
# argue about, so the same frames travel over a serial line; off by default so a
# cloud agent does not compile a serial stack.
serial = ["dep:tokio-serial"]

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-serial = { workspace = true, optional = true }
tv-rs-core.workspace = true

[dev-dependencies]
tokio.workspace = true
tv-rs-core = { workspace = true, features = ["conformance", "mock-backend"] }

[lints]
workspace = true
