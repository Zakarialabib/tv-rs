[package]
name = "tv-rs-bluetooth"
description = "Bluetooth HID keyboard and BLE remote control emulation for TV devices."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["bluetooth", "ble", "hid", "remote-control", "smart-tv"]
categories = ["api-bindings", "hardware-support", "network-programming"]

[features]
default = []
bluer = ["dep:bluer"]
btleplug = ["dep:btleplug"]

[dependencies]
async-trait.workspace = true
hex = "0.4"
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tv-rs-core.workspace = true

bluer = { version = "0.17", optional = true }
btleplug = { version = "0.11", optional = true }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
