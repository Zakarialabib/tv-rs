[package]
name = "tv-rs-discovery"
description = "Deprecated shim: SSDP / mDNS / Bonjour discovery moved to tv-rs-drivers::discovery."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ssdp", "upnp", "mdns", "bonjour", "discovery"]
categories = ["api-bindings", "network-programming"]

[features]
default = []
mobile = ["tv-rs-drivers/mobile"]

[dependencies]
tv-rs-drivers = { workspace = true, features = ["discovery"] }

[lints]
workspace = true
