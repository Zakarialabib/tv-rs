[package]
name = "tv-rs-discovery"
description = "SSDP / mDNS / Bonjour discovery and UPnP device-descriptor parsing for TV control."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ssdp", "upnp", "mdns", "bonjour", "discovery"]
categories = ["api-bindings", "network-programming"]

[features]
# Mobile commissioning: the bounded subnet sweep. Off by default so a library
# consumer does not get a host-scanning surface unless they asked for it.
mobile = []

[dependencies]
async-trait.workspace = true
ipnet = "2"
reqwest.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
# Vocabulary only: no TLS connector, no WebSocket framing (default features off).
tv-rs-transport.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
