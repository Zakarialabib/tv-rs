[package]
name = "tv-rs-androidtv"
description = "Android TV / Google TV Remote protocol v2 — Polo pairing handshake (6467) and protobuf control client (6466)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["android", "tv", "remote", "protobuf", "pairing"]
categories = ["api-bindings", "network-programming"]
publish = false

[dependencies]
prost = "0.14"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
pki-types = { package = "rustls-pki-types", version = "1.7" }
tokio.workspace = true
thiserror.workspace = true
rand = "0.8"
sha2 = "0.11"
hex = "0.4"
rsa = { version = "0.9", features = ["getrandom"] }
pkcs8 = "0.10"
rcgen = "0.14"
x509-parser = "0.18"

[dev-dependencies]
tokio.workspace = true


[lints]
workspace = true
