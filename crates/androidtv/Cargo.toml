[package]
name = "tv-rs-androidtv"
description = "Android TV / Google TV Remote protocol v2 — Polo pairing handshake (6467) and protobuf control client (6466)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["android", "tv", "remote", "protobuf", "pairing"]
categories = ["api-bindings", "network-programming"]
publish = false

[dependencies]
prost = "0.13"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = "0.26"
pki-types = { package = "rustls-pki-types", version = "1.7" }
tokio.workspace = true
thiserror.workspace = true
rand = "0.8"
sha2 = "0.11"
hex = "0.4"
rcgen = { version = "0.14", features = ["aws_lc_rs"] }
x509-parser = "0.18"

[dev-dependencies]
tokio.workspace = true

[build-dependencies]
prost-build = "0.13"

[lints]
workspace = true
