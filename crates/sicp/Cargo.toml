[package]
name = "tv-rs-sicp"
description = "Philips Serial Information Control Protocol (SICP) over TCP 5000: frames, display IDs, power, input, volume, and display temperature/status."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["philips", "sicp", "signage", "display", "tcp"]
categories = ["api-bindings", "network-programming"]

[features]
supporting = ["tv-rs-core/supporting"]
serial = ["dep:tokio-serial"]

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-serial = { workspace = true, optional = true }
tv-rs-core.workspace = true

[dev-dependencies]
tokio.workspace = true
tv-rs-core = { workspace = true, features = ["conformance", "mock-backend"] }

[lints]
workspace = true
