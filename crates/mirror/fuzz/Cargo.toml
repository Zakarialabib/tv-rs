[package]
name = "tv-rs-mirror-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tv-rs-mirror = { path = ".." }

[[bin]]
name = "fuzz_stream_packet"
path = "fuzz_targets/fuzz_stream_packet.rs"
test = false
doc = false

[[bin]]
name = "fuzz_config_payload"
path = "fuzz_targets/fuzz_config_payload.rs"
test = false
doc = false

[[bin]]
name = "fuzz_messages"
path = "fuzz_targets/fuzz_messages.rs"
test = false
doc = false
