[package]
name = "tv-rs-cli"
description = "Command-line front end for the tv-rs facade: discover, wake and control televisions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tv-rs"
path = "src/main.rs"
# The command keeps the facade's name, which collides with the library's rustdoc
# output: cargo warns on every `cargo doc --workspace` and one index overwrites the
# other. The binary is a thin front end (`publish = false`) whose documentation is
# the `--help` text, so it does not need a doc target of its own.
doc = false

[dependencies]
tv-rs = { path = "../tv-rs" }
tv-rs-core = { path = "../core" }
tv-rs-agent = { path = "../agent", features = ["mqtt"] }
clap.workspace = true
tokio.workspace = true
thiserror.workspace = true

[lints]
workspace = true
