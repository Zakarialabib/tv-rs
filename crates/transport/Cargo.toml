[package]
name = "tv-rs-transport"
description = "Shared transport vocabulary for the tv-rs workspace: the TLS policy and connector, the budgeted WebSocket frame reader and the deferred-capability error type."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["websocket", "tls", "rustls", "tokio-tungstenite", "smart-tv"]
categories = ["api-bindings", "network-programming"]

[features]
default = ["ws", "rustls", "p2p"]

# TLS connector construction and the budgeted WebSocket frame reader. Turn it
# off (`default-features = false`) to depend on this crate for the
# `Unsupported` vocabulary alone; that keeps a TLS stack out of crates such as
# `tv-rs-power` and `tv-rs-discovery`, which never open a WebSocket.
ws = ["dep:futures-util", "dep:tokio", "dep:tokio-tungstenite"]

# P2P QUIC high-speed transport layer for digital signage asset transfer.
p2p = ["dep:quinn", "dep:rcgen", "dep:rustls", "dep:tokio", "dep:bytes", "dep:serde", "dep:serde_json", "dep:sha2"]

# TLS backend. Enable exactly one:
#   rustls      — portable, no system TLS, no OpenSSL (default)
#   native-tls  — platform trust store; banned in rustls-only consumers
rustls = [
    "ws",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:sha2",
    "tokio-tungstenite/rustls-tls-native-roots",
]
native-tls = ["ws", "dep:native-tls", "tokio-tungstenite/native-tls"]

# Ask the *operating system* for the root store instead of reading one with
# `rustls-native-certs`. Additive and narrow: it changes only where the `Strict`
# policy gets its roots, and leaves `Pinned` and `TrustOnFirstUse` — which
# install their own verifiers — untouched, so it cannot weaken pinning.
#
# Why it exists: `rustls-native-certs` reads a system store. Android exposes a
# keystore and iOS its own roots, neither of which that call can see, so a
# mobile build with `Strict` has no roots to verify against.
platform-verifier = ["rustls", "dep:rustls-platform-verifier"]

[dependencies]
bytes = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
native-tls = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[lints]
workspace = true
