[package]
name = "tv-rs-core"
description = "The device model shared by every tv-rs backend: capability traits, an erased device handle, command ids, confidence-tagged observed state and the routing error taxonomy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["smart-tv", "device", "capability", "fleet", "no-tokio"]
categories = ["api-bindings", "hardware-support"]

[features]
default = ["std"]
std = [
    "alloc",
    "thiserror/std",
    "uuid/std",
    "uuid/v4",
]
alloc = []
mock-backend = ["std"]
conformance = []
supporting = []
quirks = ["dep:toml", "std"]
# Serializes the device model as JSON, for the companion's Tauri layer.
serde = ["dep:serde", "dep:serde_json", "std"]

[dependencies]
async-trait.workspace = true
thiserror = { workspace = true, default-features = false }
toml = { workspace = true, optional = true }
uuid = { workspace = true, default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
futures = { workspace = true }

[lints]
workspace = true
