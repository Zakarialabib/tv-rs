[package]
name = "tv-rs-media"
description = "Range-capable HTTP media server (HTTP 206 Partial Content + HLS manifests) for tv-rs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["hls", "http-range", "dlna", "media", "tv"]
categories = ["multimedia", "web-programming::http-server"]

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
