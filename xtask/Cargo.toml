[package]
name = "xtask"
description = "Workspace automation for tv-rs: `cargo xtask publish`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
tv-rs = { path = "../crates/tv-rs" }
tv-rs-discovery.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

# One dependency tree, two jobs: publishing needs nothing but `cargo`, while
# `hw-test` probes the LAN through the facade, which needs tokio.

[lints]
workspace = true
